<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{torrent_name}} - Files</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .header .file-count {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 5px;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-icon {
            font-size: 1.3em;
            flex-shrink: 0;
        }

        .file-size {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .file-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em;
        }

        .btn-download {
            background: #4CAF50;
            color: white;
        }

        .btn-download:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .btn-stream {
            background: #FF9800;
            /* Orange color for stream button */
            color: white;
        }

        .btn-stream:hover {
            background: #fb8c00;
            /* Darker orange on hover */
            transform: scale(1.05);
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .btn-copy.copied {
            background: #2196F3;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .file-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .file-actions {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        .back-button {
            margin-bottom: 20px;
            display: inline-block;
        }

        .error-message {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }

        .error-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📦 {{torrent_name}}</h1>
            <div class="file-count">{{file_count}} files</div>
        </div>

        <div class="file-list">
            {{#files}}
            <div class="file-item">
                <div class="file-info">
                    <div class="file-name">
                        <span class="file-icon">{{icon}}</span>
                        <span>{{name}}</span>
                    </div>
                    <div class="file-size">{{size}}</div>
                </div>
                <div class="file-actions">
                    <button class="btn btn-copy" onclick="copyToClipboard('{{download_url}}', this)">
                        📋 Copy Link
                    </button>
                    <a href="{{download_url}}" class="btn btn-download" target="_blank">
                        ⬇️ Download
                    </a>
                </div>
            </div>
            {{/files}}
        </div>
    </div>

    <script>
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = '✓ Copied!';
                button.classList.add('copied');

                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy link');
            });
        }
    </script>
</body>

</html>
