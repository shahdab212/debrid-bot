<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{filename}}</title>

    <!-- ArtPlayer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer@5/dist/artplayer.css">
    <script src="https://cdn.jsdelivr.net/npm/artplayer@5/dist/artplayer.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .subtitle {
            color: #a8a8b8;
            font-size: 0.9em;
        }

        .player-container {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #player {
            width: 100%;
            height: 70vh;
            max-height: 80vh;
        }

        .controls-hint {
            text-align: center;
            padding: 15px;
            color: #a8a8b8;
            font-size: 0.85em;
            margin-top: 20px;
        }

        .features {
            text-align: center;
            padding: 10px;
            color: #8898aa;
            font-size: 0.75em;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.2em;
            }

            #player {
                height: 50vh;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>{{filename}}</h1>
        <p class="subtitle">Powered by ArtPlayer</p>
    </div>

    <div class="player-container">
        <div id="player"></div>
    </div>

    <div class="controls-hint">
        💡 Click settings icon for playback speed • Press F for fullscreen • Space to play/pause
    </div>

    <div class="features">
        Supports: MP4 • MKV • WebM • AVI • MOV • Multiple Audio Tracks • Subtitles
    </div>

    <script>
        const videoUrl = "{{video_url}}";
        const filename = "{{filename}}";

        // Cloudflare Worker URLs already handle CORS, so use them directly
        // No need to proxy and waste server bandwidth!

        // Initialize ArtPlayer
        const art = new Artplayer({
            container: '#player',
            url: videoUrl,  // Direct URL from Cloudflare Worker
            title: filename,
            volume: 0.8,
            autoplay: false,
            autoSize: true,
            autoOrientation: true,
            fullscreen: true,
            fullscreenWeb: true,
            pip: true,
            screenshot: true,
            setting: true,
            playbackRate: true,
            aspectRatio: true,
            flip: true,
            rotate: true,
            hotkey: true,
            theme: '#667eea',
            lang: 'en',
            moreVideoAttr: {
                crossOrigin: 'anonymous',
                preload: 'metadata',
            },
            settings: [
                {
                    html: 'Playback Speed',
                    tooltip: '1.0x',
                    icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93 0 4.08-3.05 7.44-7 7.93v2.02c5.05-.5 9-4.76 9-9.95 0-5.19-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>',
                    selector: [
                        { html: '0.5x', value: 0.5 },
                        { html: '0.75x', value: 0.75 },
                        { html: '1.0x', value: 1.0, default: true },
                        { html: '1.25x', value: 1.25 },
                        { html: '1.5x', value: 1.5 },
                        { html: '2.0x', value: 2.0 },
                    ],
                    onSelect: function (item) {
                        art.playbackRate = item.value;
                        return item.html;
                    },
                },
            ],
            icons: {
                loading: '<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid" class="lds-ring" style="background:0 0"><circle cx="50" cy="50" r="40" stroke="#667eea" fill="none" stroke-width="8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" dur="2s" repeatCount="indefinite" from="0" to="502"/><animate attributeName="stroke-dasharray" dur="2s" repeatCount="indefinite" values="150.6 100.4;1 250;150.6 100.4"/></circle></svg>',
            },
        });

        // Error handling
        art.on('error', (error, reconnect) => {
            console.error('Player error:', error);
        });

        // Log events for debugging
        art.on('ready', () => {
            console.log('Player ready');
        });

        art.on('video:loadedmetadata', () => {
            console.log('Video metadata loaded');
        });

        art.on('video:canplay', () => {
            console.log('Video can play');
        });

        art.on('video:error', () => {
            console.error('Video playback error');
        });

        // Keyboard shortcuts info
        console.log('Keyboard shortcuts:');
        console.log('Space: Play/Pause');
        console.log('Arrow Left/Right: Seek');
        console.log('Arrow Up/Down: Volume');
        console.log('F: Fullscreen');
        console.log('M: Mute');
    </script>
</body>

</html>
