<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - {{filename}}</title>
    
    <!-- Shaka Player -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.0/dist/shaka-player.compiled.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            word-break: break-word;
        }
        
        .subtitle {
            color: #a8a8b8;
            font-size: 0.9em;
        }
        
        .player-container {
            position: relative;
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        video {
            width: 100%;
            height: 100%;
            max-height: 80vh;
            display: block;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 59, 48, 0.1);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid rgba(255, 59, 48, 0.5);
            max-width: 500px;
        }
        
        .error h2 {
            color: #ff3b30;
            margin-bottom: 15px;
        }
        
        .error p {
            color: #fff;
            line-height: 1.6;
        }
        
        .controls-hint {
            text-align: center;
            padding: 15px;
            color: #a8a8b8;
            font-size: 0.85em;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.2em;
            }
            
            video {
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="filename">{{filename}}</h1>
        <p class="subtitle">Powered by Shaka Player</p>
    </div>
    
    <div class="player-container">
        <video id="video" controls autoplay></video>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading video...</p>
        </div>
        
        <div class="error" id="error" style="display: none;">
            <h2>⚠️ Playback Error</h2>
            <p id="error-message"></p>
        </div>
    </div>
    
    <div class="controls-hint">
        💡 Use player controls to adjust quality, speed, and volume
    </div>
    
    <script>
        const videoUrl = "{{video_url}}";
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const errorMessage = document.getElementById('error-message');
        
        // Initialize Shaka Player
        async function initPlayer() {
            // Check if browser supports Shaka Player
            if (!shaka.Player.isBrowserSupported()) {
                showError('Your browser is not supported. Please use a modern browser like Chrome, Firefox, or Safari.');
                return;
            }
            
            const player = new shaka.Player(video);
            
            // Configure player for better streaming
            player.configure({
                streaming: {
                    bufferingGoal: 30,
                    rebufferingGoal: 2,
                    bufferBehind: 30,
                    retryParameters: {
                        timeout: 30000,
                        maxAttempts: 3,
                        baseDelay: 1000,
                        backoffFactor: 2,
                        fuzzFactor: 0.5
                    }
                }
            });
            
            // Listen for errors
            player.addEventListener('error', (event) => {
                const error = event.detail;
                console.error('Shaka Player Error:', error);
                showError(`Playback failed: ${error.message || 'Unknown error'}`);
            });
            
            // Hide loading spinner when video is ready
            video.addEventListener('loadeddata', () => {
                loading.style.display = 'none';
            });
            
            try {
                // Load the video
                await player.load(videoUrl);
                console.log('Video loaded successfully!');
            } catch (error) {
                console.error('Error loading video:', error);
                showError(`Failed to load video: ${error.message || error}`);
            }
        }
        
        function showError(message) {
            loading.style.display = 'none';
            errorDiv.style.display = 'block';
            errorMessage.textContent = message;
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPlayer);
        } else {
            initPlayer();
        }
    </script>
</body>
</html>
